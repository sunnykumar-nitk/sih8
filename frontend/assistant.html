<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Assistant -- Daring Dicey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .chat-shell {
    background: linear-gradient(160deg, var(--bg-panel), #101a2e);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 230px);
    min-height: 420px;
    overflow: hidden;
  }
  .chat-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--bg-panel-light);
  }
  .chat-toolbar .modes { display: flex; gap: 6px; }
  .mode-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    padding: 6px 12px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; border-radius: 20px; cursor: pointer; box-shadow: none;
  }
  .mode-btn:hover { transform: none; box-shadow: none; border-color: #3a4c6e; }
  .mode-btn.active { background: rgba(255, 122, 48, 0.14); border-color: var(--accent-orange); color: var(--text-primary); }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 12px 15px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent-orange), #e85f1c); color: white; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--bg-panel-light); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.bot .meta { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); }
  .msg.bot .meta .tag { display: inline-block; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; margin: 3px 4px 0 0; }
  .msg.system { align-self: center; color: var(--text-secondary); font-size: 12px; text-align: center; max-width: 90%; }
  .chat-suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 14px 22px; }
  .suggestion-chip {
    background: var(--bg-panel-light); border: 1px solid var(--border); color: var(--text-secondary);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .suggestion-chip:hover { border-color: var(--accent-orange); color: var(--text-primary); }
  .chat-input-row { display: flex; gap: 10px; padding: 16px 18px; border-top: 1px solid var(--border); background: var(--bg-panel-light); }
  .chat-input-row input { flex: 1; margin: 0; }
  .chat-input-row button { flex-shrink: 0; margin: 0; }
  .typing-dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); margin-right: 3px; animation: blink 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
</style>
</head>

    <div class="nav-section-label">Workspace</div>

  </div>

  <div class="main">
    <div id="statusBanner" class="demo-banner" style="display:none;"></div>
    <h1>AI Assistant</h1>
    <div class="subtitle">Ask about any assessed site -- answers are grounded strictly in this session's real assessment data, never invented</div>

    <div class="chat-shell">
      <div class="chat-toolbar">
        <div style="font-size:12px; color:var(--text-secondary);">Mode</div>
        <div class="modes" id="modeButtons">
          <button type="button" class="mode-btn active" data-mode="auto">Auto</button>
          <button type="button" class="mode-btn" data-mode="offline">Offline (free)</button>
          <button type="button" class="mode-btn" data-mode="online">Online (AI)</button>
        </div>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-suggestions" id="chatSuggestions"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="e.g. Why is Nepal Flood ranked as CRITICAL?">
        <button id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
